; ============================================================
; Einstellungen fuer Aufgabe 4 - Wettersensor BME280
; Hier musst du nichts aendern.
; ============================================================

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

upload_speed        = 115200
upload_resetmethod  = nodemcu
monitor_speed       = 115200

lib_deps =
  adafruit/Adafruit BME280 Library  ; liest den Wettersensor
  adafruit/Adafruit Unified Sensor  ; wird vom BME280 gebraucht
  gyverlibs/GyverOLED@^1.6.4        ; steuert das OLED-Display
  fastled/FastLED                   ; steuert die RGB-LED
