; ============================================================
; Einstellungen fuer Aufgabe 2 - RGB-LED
; Hier musst du nichts aendern.
; ============================================================

[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

upload_speed        = 115200
upload_resetmethod  = nodemcu
monitor_speed       = 115200

lib_deps =
  fastled/FastLED             ; steuert die RGB-LED
