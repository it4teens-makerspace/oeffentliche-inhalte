; ============================================================
; Einstellungen fuer Aufgabe 1 - OLED-Display
; Hier musst du nichts aendern.
; ============================================================

[env:nodemcuv2]
platform  = espressif8266     ; Chip-Familie unseres Boards
board     = nodemcuv2         ; das Board heisst "NodeMCU v2"
framework = arduino           ; wir programmieren im Arduino-Stil

upload_speed        = 115200
upload_resetmethod  = nodemcu
monitor_speed       = 115200  ; muss zu Serial.begin(115200) passen

; Zusatz-Bibliotheken, die dieses Projekt braucht:
lib_deps =
  gyverlibs/GyverOLED@^1.6.4  ; steuert das OLED-Display
